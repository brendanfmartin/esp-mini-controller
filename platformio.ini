[platformio]
default_envs = button

; Shared by every env
[env]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001

; Step 1: blink the onboard LED and print chip info over serial
[env:blink]
build_src_filter = +<blink/>

; Step 2: buttons A (GPIO32) + B (GPIO33) toggle the onboard LED
[env:button]
build_src_filter = +<button/>

; Step 3: BLE MIDI controller (two buttons + SSD1306 OLED)
[env:midi]
build_src_filter = +<midi/>
; Bluetooth stack is large; give the app the whole 3MB slot (no OTA needed)
board_build.partitions = huge_app.csv
lib_deps =
    fortyseveneffects/MIDI Library@^5.0.2
    lathoub/BLE-MIDI@^2.2
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
